<!doctype html>
<html>
  <head>
    <base target="_top">
    <style>
      body { margin: 0; font: 14px/1.45 Arial, sans-serif; color: #202124; background: #f8fafd; }
      header { background: #fff; border-bottom: 1px solid #e0e3eb; padding: 18px 24px; }
      main { max-width: 980px; margin: 0 auto; padding: 24px; }
      h1 { margin: 0 0 4px; font-size: 22px; }
      .stats { display: flex; gap: 12px; margin: 18px 0; }
      .stat { background: #fff; border: 1px solid #e0e3eb; border-radius: 8px; padding: 12px 14px; min-width: 120px; }
      .num { font-size: 24px; font-weight: 700; }
      .card { background: #fff; border: 1px solid #e0e3eb; border-radius: 8px; padding: 14px; margin: 10px 0; }
      .meta { color: #5f6368; font-size: 12px; margin: 4px 0 8px; }
      a { color: #1a73e8; }
    </style>
  </head>
  <body>
    <header>
      <h1><?= summary.appName ?></h1>
      <a href="<?= summary.sheetUrl ?>">Open Google Sheet dashboard</a>
    </header>
    <main>
      <section class="stats">
        <div class="stat"><div class="num"><?= summary.total ?></div><div>Total</div></div>
        <div class="stat"><div class="num"><?= summary.newCount ?></div><div>New</div></div>
        <div class="stat"><div class="num"><?= summary.starredCount ?></div><div>Starred</div></div>
      </section>
      <? for (var i = 0; i < summary.top.length; i++) { var item = summary.top[i]; ?>
        <article class="card">
          <strong><?= item.company ?> - <?= item.role ?></strong>
          <div class="meta">
            <?= item.location ?> | <?= item.track ?> | Part-time: <?= item.part_time ?> | Score: <?= item.score ?>
          </div>
          <div><?= item.details ?></div>
          <a href="<?= item.url ?>" target="_blank">View posting</a>
        </article>
      <? } ?>
    </main>
  </body>
</html>
